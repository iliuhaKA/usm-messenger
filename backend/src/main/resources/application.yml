spring:
  application:
    name: usm-messenger

  datasource:
    url: jdbc:postgresql://localhost:5432/usm_messenger
    username: usm
    password: usm123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none  # Используем Flyway для миграций
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/usm_messenger}
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2s

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  security:
    user:
      name: admin
      password: admin  # Временно для тестирования

server:
  port: 8443
  ssl:
    enabled: true
    key-store: classpath:keystore.p12
    key-store-password: ${SSL_KEYSTORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: usm
  error:
    include-message: always
    include-binding-errors: always

app:
  security:
    # Ключ AES-256 в base64. В проде задавать через переменную окружения MESSAGE_ENCRYPTION_KEY,
    # значение ниже — только для локальной разработки.
    message-encryption-key: ${MESSAGE_ENCRYPTION_KEY:bzAwaeg8IBTv53epzFTgtHf9w68iuLBPYJ/NkttkU1o=}
  jwt:
    # Секрет для подписи JWT (HMAC-SHA256). >= 32 байта в base64.
    # Сгенерировать новый: openssl rand -base64 32
    secret: ${APP_JWT_SECRET:ZGV2LWp3dC1zZWNyZXQtcmVwbGFjZS1pbi1wcm9kLTI1Ni1iaXRzLW1pbi0xMjM=}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}

logging:
  level:
    com.usm.messenger: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
