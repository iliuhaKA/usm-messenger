version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: usm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: usm_messenger
      POSTGRES_USER: usm
      POSTGRES_PASSWORD: usm123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usm"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local